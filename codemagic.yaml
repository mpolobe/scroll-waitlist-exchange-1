workflows:
  # Android Debug Build Workflow
  android-debug:
    name: Africoin Wallet Android (Debug)
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    # Enable caching for faster rebuilds
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - node_modules
    
    environment:
      groups:
        - africoin_env_vars
        - browserstack_credentials
      vars:
        PACKAGE_NAME: "com.africoin.wallet"
        APP_NAME: "Africoin Wallet"
        VITE_ALCHEMY_API_KEY: $VITE_ALCHEMY_API_KEY
        VITE_ALCHEMY_GAS_POLICY_ID: $VITE_ALCHEMY_GAS_POLICY_ID
        VITE_SUPABASE_URL: $VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
        VITE_GEMINI_API_KEY: $VITE_GEMINI_API_KEY
      node: 20.19.6
      java: 21
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Install system dependencies
        script: |
          if ! command -v jq &> /dev/null; then
            brew install jq
          fi
      
      - name: Install dependencies
        script: |
          # Use npm ci for faster, more reliable installs in CI/CD
          npm ci
 
      - name: Build web app
        script: |
          npm run build
 
      - name: Setup Capacitor
        script: |
          # Only install if not cached
          if [ ! -d "node_modules/@capacitor/core" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi
          
          # Only add Android if it doesn't exist
          if [ ! -d "android/app" ]; then
            npx cap add android
          fi
 
      - name: Sync Capacitor
        script: |
          npx cap sync android
          
      - name: Fix dependency conflicts
        script: |
          cd android
          # Make gradlew executable and clean build
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean
          else
            echo "Warning: gradlew not found, skipping clean step"
          fi
 
      - name: Build Android APK (Debug)
        script: |
          cd android
          ./gradlew assembleDebug
 
      - name: Upload to BrowserStack
        script: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "Uploading APK to BrowserStack..."
            RESPONSE=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
              -F "file=@$APK_PATH")
            
            echo "BrowserStack Response:"
            if command -v jq &> /dev/null; then
              echo "$RESPONSE" | jq '.'
              APP_URL=$(echo "$RESPONSE" | jq -r '.app_url')
            else
              echo "$RESPONSE"
              APP_URL=$(echo "$RESPONSE" | grep -o '"app_url":"[^"]*"' | cut -d'"' -f4)
            fi
            
            echo ""
            echo "✅ APK uploaded successfully!"
            echo "App URL: $APP_URL"
            echo "Test at: https://app-live.browserstack.com/"
          else
            echo "⚠️  APK not found at $APK_PATH"
            exit 1
          fi
 
    artifacts:
      - android/app/build/outputs/**/*.apk
 
    publishing:
      email:
        recipients:
          - ben.mpolokoso@gmail.com
        notify:
          success: true
          failure: true

  # Android Release Build Workflow
  android-release:
    name: Africoin Wallet Android (Release)
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    # Enable caching for faster rebuilds
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - node_modules
    
    environment:
      groups:
        - africoin_env_vars
        - android_signing
        - browserstack_credentials
      android_signing:
        - africoin_release
      vars:
        PACKAGE_NAME: "com.africoin.wallet"
        APP_NAME: "Africoin Wallet"
        VITE_ALCHEMY_API_KEY: $VITE_ALCHEMY_API_KEY
        VITE_ALCHEMY_GAS_POLICY_ID: $VITE_ALCHEMY_GAS_POLICY_ID
        VITE_SUPABASE_URL: $VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
        VITE_GEMINI_API_KEY: $VITE_GEMINI_API_KEY
      node: 20.19.6
      java: 21
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - name: Install system dependencies
        script: |
          if ! command -v jq &> /dev/null; then
            brew install jq
          fi
      
      - name: Install dependencies
        script: |
          # Use npm ci for faster, more reliable installs in CI/CD
          npm ci
 
      - name: Build web app
        script: |
          npm run build
 
      - name: Setup Capacitor
        script: |
          # Only install if not cached
          if [ ! -d "node_modules/@capacitor/core" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi
          
          # Only add Android if it doesn't exist
          if [ ! -d "android/app" ]; then
            npx cap add android
          fi
 
      - name: Sync Capacitor
        script: |
          npx cap sync android
          
      - name: Fix dependency conflicts
        script: |
          cd android
          # Make gradlew executable and clean build
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean
          else
            echo "Warning: gradlew not found, skipping clean step"
          fi
 
      - name: Set up code signing
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_KEYSTORE_PATH
          cat >> android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
 
      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease
 
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
 
      - name: Upload to BrowserStack
        script: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "Uploading release APK to BrowserStack..."
            RESPONSE=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
              -F "file=@$APK_PATH")
            
            echo "BrowserStack Response:"
            if command -v jq &> /dev/null; then
              echo "$RESPONSE" | jq '.'
              APP_URL=$(echo "$RESPONSE" | jq -r '.app_url')
            else
              echo "$RESPONSE"
              APP_URL=$(echo "$RESPONSE" | grep -o '"app_url":"[^"]*"' | cut -d'"' -f4)
            fi
            
            echo ""
            echo "✅ Release APK uploaded to BrowserStack!"
            echo "App URL: $APP_URL"
            echo "Test at: https://app-live.browserstack.com/"
          else
            echo "⚠️  APK not found at $APK_PATH"
            exit 1
          fi
 
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
 
    publishing:
      email:
        recipients:
          - ben.mpolokoso@gmail.com
        notify:
          success: true
          failure: true
      
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      #   track: internal  # or alpha, beta, production
      #   submit_as_draft: true
 
  # iOS Build Workflow
  # DISABLED: Requires Apple Developer account and App Store Connect setup
  # See IOS_CODE_SIGNING_FIX.md for setup instructions
  ios-workflow:
    name: Africoin Wallet iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.africoin.wallet
      groups:
        - africoin_env_vars
      vars:
        PACKAGE_NAME: "com.africoin.wallet"
        APP_NAME: "Africoin Wallet"
        VITE_ALCHEMY_API_KEY: $VITE_ALCHEMY_API_KEY
        VITE_ALCHEMY_GAS_POLICY_ID: $VITE_ALCHEMY_GAS_POLICY_ID
        VITE_SUPABASE_URL: $VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
        VITE_GEMINI_API_KEY: $VITE_GEMINI_API_KEY
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.6
      xcode: 15.0
      cocoapods: default
    triggering:
      # Disabled until Apple Developer account is set up
      events: []
      # Uncomment when ready:
      # events:
      #   - push
      #   - tag
      #   - pull_request
      # branch_patterns:
      #   - pattern: 'main'
      #     include: true
      #     source: true
      #   - pattern: 'develop'
      #     include: true
      #     source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
 
      - name: Build web app
        script: |
          npm run build
 
      - name: Install Capacitor (if not already installed)
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
 
      - name: Sync Capacitor
        script: |
          npx cap sync ios
 
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
 
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$PACKAGE_NAME" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
 
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
 
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
 
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
 
    publishing:
      email:
        recipients:
          - ben.mpolokoso@gmail.com
        notify:
          success: true
          failure: true
 
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
