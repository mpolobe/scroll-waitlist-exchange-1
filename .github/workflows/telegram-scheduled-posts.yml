name: Telegram Scheduled Posts

on:
  schedule:
    # Daily reminder at 9 AM UTC
    - cron: '0 9 * * *'
    # Evening reminder at 6 PM UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      message_type:
        description: 'Message template to post'
        required: true
        default: 'daily_reminder'
        type: choice
        options:
          - daily_reminder
          - ido_live
          - countdown
          - ecosystem
          - why_sent
          - afc_token
          - custom
      custom_message:
        description: 'Custom message (only if message_type is custom)'
        required: false
        type: string

env:
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: '@afrcsentinel'

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Determine message content
        id: message
        run: |
          MESSAGE_TYPE="${{ github.event.inputs.message_type || 'daily_reminder' }}"
          
          case "$MESSAGE_TYPE" in
            "ido_live")
              MESSAGE="🚂 *\$SENT Token IDO is LIVE on PinkSale!*

🌍 Building Africa's railway safety infrastructure
✅ Audited Contract
✅ Locked Liquidity  
✅ Real Utility - 2,000+ track workers

🔗 Join now: [PinkSale Launchpad](https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08)

#SENT #PinkSale #Polygon #Crypto"
              ;;
            "countdown")
              MESSAGE="⏰ *SENT IDO Countdown!*

🚀 Don't miss the opportunity!
📅 IDO is live NOW on PinkSale

🔗 Participate: [PinkSale](https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08)

#SENT #IDO #Crypto"
              ;;
            "ecosystem")
              MESSAGE="🌍 *Africa Railways Ecosystem*

🔹 *\$AFC* - Payment token on Sui
🔹 *\$SENT* - Governance token on Polygon  
🔹 Real utility with railway integration

🌐 Website: [africarailways.com](https://africarailways.com)
📊 Reviews: [Project Reviews](https://africarailways.com/reviews)

#AfricaRailways #Crypto #DeFi #RWA"
              ;;
            "why_sent")
              MESSAGE="💡 *Why \$SENT is a gem:*

1️⃣ Real utility - 2,000+ railway workers
2️⃣ Proof-of-Safety consensus
3️⃣ Audited & verified on PinkSale
4️⃣ Low market cap opportunity
5️⃣ Strong roadmap through 2026

📖 DYOR: [Read Full Review](https://africarailways.com/reviews/sent-token-sentinel-network)

#SENT #CryptoGems"
              ;;
            "afc_token")
              MESSAGE="🚀 *Africoin (\$AFC) - Live on Sui Mainnet!*

💰 Pan-African payment token
⚡ Fast & cheap transactions
🎫 Railway ticket purchases
🏪 Merchant payments

🔗 Buy AFC: [MovePump](https://movepump.com/token/0xc68c4cfb63d702227db09c28837e75abd23bbb3adc192e3bc45fecca4dd5b7e8::afc::AFC)

#AFC #Sui #Crypto #Africa"
              ;;
            "custom")
              MESSAGE="${{ github.event.inputs.custom_message }}"
              ;;
            *)
              # Default: daily_reminder
              MESSAGE="⏰ *Daily Reminder: SENT IDO is live!*

🛡️ Sentinel Network - Railway Safety Token
📈 Join early for best allocation

👉 [Participate Now](https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08)

#SENT #PinkSale #Polygon"
              ;;
          esac
          
          # Escape for JSON
          MESSAGE=$(echo "$MESSAGE" | jq -Rs .)
          echo "content=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Post to Telegram
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"$CHAT_ID\",
              \"text\": ${{ steps.message.outputs.content }},
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": false
            }")
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | jq -e '.ok == true' > /dev/null; then
            echo "✅ Message posted successfully!"
            MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id')
            echo "Message ID: $MESSAGE_ID"
          else
            echo "❌ Failed to post message"
            echo "$RESPONSE" | jq .
            exit 1
          fi

      - name: Log post details
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Telegram Post Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Channel: $CHAT_ID"
          echo "  Type: ${{ github.event.inputs.message_type || 'daily_reminder' }}"
          echo "  Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
