name: Automatic Pull Requests from Vercel

on:
  push:
    branches:
      - main  # Trigger on pushes to the `main` branch

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Deployment from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes

      - name: Commit Changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Update deployment files from Vercel" || echo "No changes to commit"

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          branch: vercel-auto-update
          title: "Auto-sync deployment files from Vercel"
          body: "This PR was created automatically by syncing Vercel deployment files."
          commit-message: "Sync deployment files from Vercel"